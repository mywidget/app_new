name: Build Neutralino Windows

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis (contoh: 1.0.1)"
        required: true
        default: "1.0.1"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # NODE
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ==========================================
      # VERSION
      # ==========================================
      - name: Determine Version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
              $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          else {
              $ver = "${{ inputs.version }}".Trim()
          }

          if ([string]::IsNullOrWhiteSpace($ver)) {
              throw "Versi tidak ditemukan."
          }

          Write-Host "Release version: $ver"

          "VERSION=$ver" >> $env:GITHUB_ENV

      # ==========================================
      # UPDATE APP VERSION
      # ==========================================
      - name: Update Version
        shell: pwsh
        run: |
          $config = Get-Content neutralino.config.json -Raw | ConvertFrom-Json

          $config.version = "$env:VERSION"

          $config |
            ConvertTo-Json -Depth 20 |
            Set-Content neutralino.config.json -Encoding UTF8

          Write-Host "Application version updated to $env:VERSION"

      # ==========================================
      # INSTALL NPM
      # ==========================================
      - name: Install Dependencies
        run: npm ci

      # ==========================================
      # VITE BUILD
      # ==========================================
      - name: Build Web Assets
        run: npm run build

      # ==========================================
      # NEUTRALINO UPDATE
      # ==========================================
      - name: Update Neutralino Framework
        shell: pwsh
        run: |
          Write-Host "Updating Neutralino framework..."

          npx neu update --latest

          Write-Host ""
          Write-Host "Neutralino version:"
          npx neu version

      # ==========================================
      # NEUTRALINO BUILD
      # ==========================================
      - name: Build Neutralino
        shell: pwsh
        run: |
          Write-Host "Building Neutralino..."

          npx neu build

          Write-Host ""
          Write-Host "Build output:"
          Get-ChildItem -Path "dist" -Recurse |
            Select-Object FullName

      # ==========================================
      # PREPARE RELEASE DIRECTORY
      # ==========================================
      - name: Prepare Release Files
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist" -Recurse -Filter "*-win_x64.exe" |
            Select-Object -First 1

          if (-not $exe) {
              Write-Host "ERROR: Windows EXE tidak ditemukan."
              Write-Host ""
              Write-Host "Isi dist:"
              Get-ChildItem "dist" -Recurse | Select-Object FullName
              exit 1
          }

          $resources = Get-ChildItem "dist" -Recurse -Filter "resources.neu" |
            Select-Object -First 1

          if (-not $resources) {
              Write-Host "ERROR: resources.neu tidak ditemukan."
              exit 1
          }

          New-Item -ItemType Directory -Force -Path "release_installer" | Out-Null

          Copy-Item $exe.FullName `
            "release_installer\PrintProPOS-win_x64.exe" `
            -Force

          Copy-Item $resources.FullName `
            "release_installer\resources.neu" `
            -Force

          Write-Host ""
          Write-Host "Prepared:"
          Get-ChildItem "release_installer"

      # ==========================================
      # INNO SETUP
      # ==========================================
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      # ==========================================
      # CREATE INSTALLER SCRIPT
      # ==========================================
      - name: Create Inno Setup Script
        shell: pwsh
        run: |
          $lines = @(
              '[Setup]',
              'AppName=PrintPro POS',
              "AppVersion=$env:VERSION",
              'AppPublisher=PrintPro',
              'DefaultDirName={autopf}\PrintProPOS',
              'DefaultGroupName=PrintPro POS',
              'OutputDir=release_installer',
              "OutputBaseFilename=PrintPro-Setup-v$env:VERSION",
              'Compression=lzma',
              'SolidCompression=yes',
              'ArchitecturesInstallIn64BitMode=x64',
              '',
              '[Files]',
              'Source: "release_installer\PrintProPOS-win_x64.exe"; DestDir: "{app}"; Flags: ignoreversion',
              'Source: "release_installer\resources.neu"; DestDir: "{app}"; Flags: ignoreversion',
              '',
              '[Icons]',
              'Name: "{group}\PrintPro POS"; Filename: "{app}\PrintProPOS-win_x64.exe"',
              'Name: "{autodesktop}\PrintPro POS"; Filename: "{app}\PrintProPOS-win_x64.exe"',
              '',
              '[Run]',
              'Filename: "{app}\PrintProPOS-win_x64.exe"; Description: "Jalankan Aplikasi"; Flags: nowait postinstall skipifsilent'
          )

          $lines |
            Set-Content -Path "setup.iss" -Encoding UTF8

      # ==========================================
      # COMPILE INSTALLER
      # ==========================================
      - name: Compile Installer
        shell: pwsh
        run: |
          $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $isccPath)) {
              $isccPath = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $isccPath)) {
              throw "ISCC.exe tidak ditemukan."
          }

          & $isccPath "setup.iss"

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup gagal."
          }

      # ==========================================
      # UPDATE JSON
      # ==========================================
      - name: Generate update.json
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $ver = $env:VERSION

          $updateJson = @{
              applicationId = "id.printpro.pos"
              version = $ver
              resourcesURL = "https://github.com/$repo/releases/download/v$ver/resources.neu"
              downloadUrl = "https://github.com/$repo/releases/download/v$ver/PrintPro-Setup-v$ver.exe"
              changelog = "Pembaruan otomatis versi $ver"
          } | ConvertTo-Json -Depth 5

          Set-Content `
            -Path "release_installer/update.json" `
            -Value $updateJson `
            -Encoding UTF8

          Write-Host $updateJson

      # ==========================================
      # GITHUB RELEASE
      # ==========================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PrintPro POS v${{ env.VERSION }}
          files: |
            release_installer/PrintPro-Setup-v${{ env.VERSION }}.exe
            release_installer/resources.neu
            release_installer/update.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
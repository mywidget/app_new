name: Build Neutralino Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis (contoh: 1.0.1)"
        required: true
        default: "1.0.1"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_type }}" -eq "tag" ? "${{ github.ref_name }}".TrimStart("v") : "${{ inputs.version }}".Trim()
          "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Update Version in neutralino.config.json
        shell: pwsh
        run: |
          $config = Get-Content neutralino.config.json -Raw | ConvertFrom-Json
          $config.version = "$env:VERSION"
          $config | ConvertTo-Json -Depth 10 | Set-Content neutralino.config.json -Encoding UTF8

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Download Neutralino Binary & Build Bundle
        shell: pwsh
        run: |
          $config = Get-Content neutralino.config.json -Raw | ConvertFrom-Json
          $neuVer = $config.cli.binaryVersion
          $binUrl = "https://github.com/neutralinojs/neutralinojs/releases/download/v$neuVer/neutralinojs-v$neuVer.zip"
          Write-Host "Downloading Neutralino binary from $binUrl..."
          Invoke-WebRequest -Uri $binUrl -OutFile "neutralinojs.zip"
          Expand-Archive -Path "neutralinojs.zip" -DestinationPath "bin" -Force
          Remove-Item "neutralinojs.zip"
          npx neu build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Create Inno Setup Script
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppName=PrintPro POS
          AppVersion=$env:VERSION
          AppPublisher=PrintPro
          DefaultDirName={autopf}\PrintProPOS
          DefaultGroupName=PrintPro POS
          OutputDir=release_installer
          OutputBaseFilename=PrintPro-Setup-v$env:VERSION
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64

          [Files]
          Source: "release\PrintProPOS\PrintProPOS-win_x64.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "release\PrintProPOS\resources.neu"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\PrintPro POS"; Filename: "{app}\PrintProPOS-win_x64.exe"
          Name: "{autodesktop}\PrintPro POS"; Filename: "{app}\PrintProPOS-win_x64.exe"

          [Run]
          Filename: "{app}\PrintProPOS-win_x64.exe"; Description: "Jalankan Aplikasi"; Flags: nowait postinstall skipifsilent
"@
          Set-Content -Path "setup.iss" -Value $iss -Encoding UTF8

      - name: Compile Installer
        shell: pwsh
        run: & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" setup.iss

      - name: Generate update.json
        shell: pwsh
        run: |
          $updateJson = @{
              applicationId = "id.printpro.pos"
              version = "$env:VERSION"
              resourcesURL = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/resources.neu"
              downloadUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/PrintPro-Setup-v$env:VERSION.exe"
              changelog = "Pembaruan otomatis versi $env:VERSION"
          } | ConvertTo-Json -Depth 5

          New-Item -ItemType Directory -Force -Path "release_installer" | Out-Null
          Set-Content -Path "release_installer/update.json" -Value $updateJson -Encoding UTF8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PrintPro POS v${{ env.VERSION }}
          files: |
            release_installer/PrintPro-Setup-v${{ env.VERSION }}.exe
            release/PrintProPOS/resources.neu
            release_installer/update.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
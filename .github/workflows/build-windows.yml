name: Build Neutralino Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis (contoh: 1.0.1)"
        required: true
        default: "1.0.1"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_type }}" -eq "tag" ? "${{ github.ref_name }}".TrimStart("v") : "${{ inputs.version }}".Trim()
          "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Update Version in neutralino.config.json
        shell: pwsh
        run: |
          $config = Get-Content neutralino.config.json -Raw | ConvertFrom-Json
          $config.version = "$env:VERSION"
          $config | ConvertTo-Json -Depth 10 | Set-Content neutralino.config.json -Encoding UTF8

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Download Neutralino Binary & Client JS, then Build
        shell: pwsh
        run: |
          $config = Get-Content neutralino.config.json -Raw | ConvertFrom-Json
          $neuVer = $config.cli.binaryVersion

          if ($neuVer -eq "latest" -or [string]::IsNullOrWhiteSpace($neuVer)) {
              Write-Host "Binary version is 'latest'. Fetching latest version..."
              $latestRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/neutralinojs/neutralinojs/releases/latest"
              $neuVer = $latestRelease.tag_name.TrimStart("v")
          }

          $binUrl = "https://github.com/neutralinojs/neutralinojs/releases/download/v$neuVer/neutralinojs-v$neuVer.zip"
          Write-Host "Downloading Neutralino binary v$neuVer..."
          Invoke-WebRequest -Uri $binUrl -OutFile "neutralinojs.zip"
          Expand-Archive -Path "neutralinojs.zip" -DestinationPath "bin" -Force
          Remove-Item "neutralinojs.zip"

          Write-Host "Downloading neutralino.js client..."
          $clientUrl = "https://github.com/neutralinojs/neutralino.js/releases/latest/download/neutralino.js"
          
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/js" | Out-Null
          
          Invoke-WebRequest -Uri $clientUrl -OutFile "dist/neutralino.js"
          Invoke-WebRequest -Uri $clientUrl -OutFile "dist/js/neutralino.js"

          npx neu build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Create Inno Setup Script & Compile Installer
        shell: pwsh
        run: |
          # Cari file .exe hasil build Neutralino secara dinamis
          $exeFile = Get-ChildItem -Path "release\*\*.exe" | Select-Object -First 1
          if (-not $exeFile) {
              Write-Error "File executable hasil build Neutralino tidak ditemukan di folder release!"
              exit 1
          }

          $exeName = $exeFile.Name
          $exeRelPath = $exeFile.FullName.Replace((Get-Location).Path + "\", "")

          Write-Host "Ditemukan file executable Neutralino: $exeRelPath"

          $lines = @(
              '[Setup]',
              'AppName=PrintPro POS',
              "AppVersion=$env:VERSION",
              'AppPublisher=PrintPro',
              'DefaultDirName={autopf}\PrintProPOS',
              'DefaultGroupName=PrintPro POS',
              'OutputDir=release_installer',
              "OutputBaseFilename=PrintPro-Setup-v$env:VERSION",
              'Compression=lzma',
              'SolidCompression=yes',
              'ArchitecturesInstallIn64BitMode=x64',
              '',
              '[Files]',
              "Source: ""$exeRelPath""; DestDir: ""{app}""; Flags: ignoreversion",
              'Source: "release\*\resources.neu"; DestDir: "{app}"; Flags: ignoreversion',
              '',
              '[Icons]',
              "Name: ""{group}\PrintPro POS""; Filename: ""{app}\$exeName""",
              "Name: ""{autodesktop}\PrintPro POS""; Filename: ""{app}\$exeName""",
              '',
              '[Run]',
              "Filename: ""{app}\$exeName""; Description: ""Jalankan Aplikasi""; Flags: nowait postinstall skipifsilent"
          )
          $lines | Set-Content -Path "setup.iss" -Encoding UTF8

          # Jalankan ISCC secara langsung agar output log Inno Setup tampil penuh
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }

          & $iscc setup.iss

      - name: Generate update.json
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $ver = $env:VERSION
          $updateJson = @{
              applicationId = "id.printpro.pos"
              version = $ver
              resourcesURL = "https://github.com/$repo/releases/download/v$ver/resources.neu"
              downloadUrl = "https://github.com/$repo/releases/download/v$ver/PrintPro-Setup-v$ver.exe"
              changelog = "Pembaruan otomatis versi $ver"
          } | ConvertTo-Json -Depth 5

          New-Item -ItemType Directory -Force -Path "release_installer" | Out-Null
          Set-Content -Path "release_installer/update.json" -Value $updateJson -Encoding UTF8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PrintPro POS v${{ env.VERSION }}
          files: |
            release_installer/PrintPro-Setup-v${{ env.VERSION }}.exe
            release/*/resources.neu
            release_installer/update.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
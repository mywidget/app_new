name: Build Neutralino Windows

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis, contoh 1.0.1"
        required: true
        default: "1.0.1"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build PrintPro POS Windows
    runs-on: windows-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # ==========================================================
      # 2. SETUP NODE
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ==========================================================
      # 3. DETERMINE VERSION
      # ==========================================================
      - name: Determine Version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
              $VERSION = "${{ github.ref_name }}".TrimStart("v")
          }
          else {
              $VERSION = "${{ inputs.version }}".Trim()
          }

          if ([string]::IsNullOrWhiteSpace($VERSION)) {
              throw "VERSION tidak ditemukan."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "PRINTPRO POS RELEASE"
          Write-Host "=============================================="
          Write-Host "VERSION = $VERSION"
          Write-Host ""

          "VERSION=$VERSION" >> $env:GITHUB_ENV


      # ==========================================================
      # 4. CHECK PROJECT
      # ==========================================================
      - name: Check Project
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "CHECK PROJECT"
          Write-Host "=============================================="

          if (-not (Test-Path "package.json")) {
              throw "package.json tidak ditemukan."
          }

          if (-not (Test-Path "neutralino.config.json")) {
              throw "neutralino.config.json tidak ditemukan."
          }

          Write-Host ""
          Write-Host "package.json ditemukan."
          Write-Host "neutralino.config.json ditemukan."

          Write-Host ""
          Write-Host "Isi root project:"
          Get-ChildItem -Force |
              Select-Object Name, Mode


      # ==========================================================
      # 5. SHOW NEUTRALINO CONFIG
      # ==========================================================
      - name: Show Neutralino Configuration
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "NEUTRALINO CONFIG"
          Write-Host "=============================================="

          Get-Content "neutralino.config.json"


      # ==========================================================
      # 6. UPDATE APPLICATION VERSION
      # ==========================================================
      - name: Update Application Version
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "UPDATE APPLICATION VERSION"
          Write-Host "=============================================="

          $config = Get-Content "neutralino.config.json" -Raw |
              ConvertFrom-Json

          $config.version = "$env:VERSION"

          $config |
              ConvertTo-Json -Depth 20 |
              Set-Content "neutralino.config.json" -Encoding UTF8

          Write-Host "Application version:"
          Write-Host $config.version


      # ==========================================================
      # 7. INSTALL DEPENDENCIES
      # ==========================================================
      - name: Install Dependencies
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "NPM CI"
          Write-Host "=============================================="

          npm ci

          if ($LASTEXITCODE -ne 0) {
              throw "npm ci gagal."
          }


      # ==========================================================
      # 8. BUILD VITE
      # ==========================================================
      - name: Build Web Application
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "BUILD VITE"
          Write-Host "=============================================="

          npm run build

          if ($LASTEXITCODE -ne 0) {
              throw "npm run build gagal."
          }

          if (-not (Test-Path "dist")) {
              throw "Folder dist tidak ditemukan."
          }

          Write-Host ""
          Write-Host "Vite berhasil."

          Write-Host ""
          Write-Host "Isi dist:"
          Get-ChildItem "dist" -Recurse |
              Select-Object FullName


      # ==========================================================
      # 9. UPDATE NEUTRALINO
      # ==========================================================
      - name: Update Neutralino
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "NEUTRALINO UPDATE"
          Write-Host "=============================================="

          npx neu update --latest

          if ($LASTEXITCODE -ne 0) {
              throw "npx neu update --latest gagal."
          }

          Write-Host ""
          Write-Host "Neutralino update berhasil."


      # ==========================================================
      # 10. SHOW NEUTRALINO VERSION
      # ==========================================================
      - name: Show Neutralino Version
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "NEUTRALINO VERSION"
          Write-Host "=============================================="

          npx neu version

          if ($LASTEXITCODE -ne 0) {
              throw "npx neu version gagal."
          }


      # ==========================================================
      # 11. VERIFY CONFIG AFTER UPDATE
      # ==========================================================
      - name: Verify Neutralino Config
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "VERIFY CONFIG AFTER NEU UPDATE"
          Write-Host "=============================================="

          $config = Get-Content "neutralino.config.json" -Raw |
              ConvertFrom-Json

          Write-Host "applicationId    = $($config.applicationId)"
          Write-Host "applicationName  = $($config.applicationName)"
          Write-Host "version          = $($config.version)"
          Write-Host "documentRoot     = $($config.documentRoot)"
          Write-Host "resourcesPath    = $($config.cli.resourcesPath)"
          Write-Host "distributionPath = $($config.cli.distributionPath)"
          Write-Host "binaryName       = $($config.cli.binaryName)"
          Write-Host "binaryVersion    = $($config.cli.binaryVersion)"
          Write-Host "clientVersion    = $($config.cli.clientVersion)"
          Write-Host "clientLibrary    = $($config.cli.clientLibrary)"

          if ($config.cli.distributionPath -ne "/release/neutralino") {
              Write-Host ""
              Write-Host "WARNING:"
              Write-Host "distributionPath bukan /release/neutralino."
              Write-Host "Path aktual akan digunakan oleh workflow."
          }


      # ==========================================================
      # 12. BUILD NEUTRALINO
      # ==========================================================
      - name: Build Neutralino Windows
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "NEUTRALINO BUILD"
          Write-Host "=============================================="

          npx neu build

          if ($LASTEXITCODE -ne 0) {
              throw "npx neu build gagal."
          }

          Write-Host ""
          Write-Host "npx neu build selesai."


      # ==========================================================
      # 13. DEBUG ALL BUILD OUTPUT
      # ==========================================================
      - name: Inspect Build Output
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "INSPECT BUILD OUTPUT"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "ROOT:"
          Get-ChildItem -Force |
              Select-Object Name, Mode

          Write-Host ""
          Write-Host "RELEASE:"
          if (Test-Path "release") {
              Get-ChildItem "release" -Recurse |
                  Select-Object FullName, Length
          }
          else {
              Write-Host "Folder release tidak ada."
          }

          Write-Host ""
          Write-Host "DIST:"
          if (Test-Path "dist") {
              Get-ChildItem "dist" -Recurse |
                  Select-Object FullName, Length
          }


      # ==========================================================
      # 14. FIND EXE + RESOURCES
      # ==========================================================
      - name: Find Neutralino Windows Files
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "SEARCH NEUTRALINO FILES"
          Write-Host "=============================================="

          # Cari semua EXE di release
          $exeFiles = @()

          if (Test-Path "release") {
              $exeFiles = @(
                  Get-ChildItem `
                      "release" `
                      -Recurse `
                      -Filter "*.exe" `
                      -File
              )
          }

          Write-Host ""
          Write-Host "EXE FOUND: $($exeFiles.Count)"

          foreach ($file in $exeFiles) {
              Write-Host " - $($file.FullName)"
          }

          if ($exeFiles.Count -eq 0) {
              Write-Host ""
              Write-Host "ERROR: Tidak ada EXE Neutralino."
              Write-Host ""
              Write-Host "Semua file di release:"

              if (Test-Path "release") {
                  Get-ChildItem "release" -Recurse |
                      Select-Object FullName, Length
              }

              exit 1
          }

          # Prioritas nama binary PrintProPOS
          $exe = $exeFiles |
              Where-Object {
                  $_.Name -like "PrintProPOS*.exe"
              } |
              Select-Object -First 1

          # Kalau tidak ada, gunakan EXE pertama
          if (-not $exe) {
              $exe = $exeFiles | Select-Object -First 1
          }

          Write-Host ""
          Write-Host "SELECTED EXE:"
          Write-Host $exe.FullName

          # Cari resources.neu
          $resourcesFiles = @()

          if (Test-Path "release") {
              $resourcesFiles = @(
                  Get-ChildItem `
                      "release" `
                      -Recurse `
                      -Filter "resources.neu" `
                      -File
              )
          }

          Write-Host ""
          Write-Host "RESOURCES FOUND: $($resourcesFiles.Count)"

          foreach ($file in $resourcesFiles) {
              Write-Host " - $($file.FullName)"
          }

          if ($resourcesFiles.Count -eq 0) {
              Write-Host ""
              Write-Host "ERROR: resources.neu tidak ditemukan."
              exit 1
          }

          $resources = $resourcesFiles | Select-Object -First 1

          Write-Host ""
          Write-Host "SELECTED RESOURCES:"
          Write-Host $resources.FullName

          # Simpan path ke environment
          "NEUTRALINO_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "NEUTRALINO_RESOURCES=$($resources.FullName)" >> $env:GITHUB_ENV


      # ==========================================================
      # 15. PREPARE INSTALLER FILES
      # ==========================================================
      - name: Prepare Installer Files
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "PREPARE INSTALLER"
          Write-Host "=============================================="

          New-Item `
              -ItemType Directory `
              -Force `
              -Path "release_installer" |
              Out-Null

          Write-Host ""
          Write-Host "Copy EXE:"
          Write-Host $env:NEUTRALINO_EXE

          Copy-Item `
              $env:NEUTRALINO_EXE `
              "release_installer\PrintProPOS-win_x64.exe" `
              -Force

          Write-Host ""
          Write-Host "Copy resources:"
          Write-Host $env:NEUTRALINO_RESOURCES

          Copy-Item `
              $env:NEUTRALINO_RESOURCES `
              "release_installer\resources.neu" `
              -Force

          if (-not (Test-Path "release_installer\PrintProPOS-win_x64.exe")) {
              throw "EXE gagal disalin."
          }

          if (-not (Test-Path "release_installer\resources.neu")) {
              throw "resources.neu gagal disalin."
          }

          Write-Host ""
          Write-Host "Installer source files:"
          Get-ChildItem "release_installer" |
              Select-Object Name, Length


      # ==========================================================
      # 16. INSTALL INNO SETUP
      # ==========================================================
      - name: Install Inno Setup
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "INSTALL INNO SETUP"
          Write-Host "=============================================="

          choco install innosetup -y --no-progress

          if ($LASTEXITCODE -ne 0) {
              throw "Install Inno Setup gagal."
          }


      # ==========================================================
      # 17. CREATE INNO SCRIPT
      # ==========================================================
      - name: Create Inno Setup Script
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "CREATE SETUP.ISS"
          Write-Host "=============================================="

          $lines = @(
              '[Setup]',
              'AppId={{id.printpro.pos}}',
              'AppName=PrintPro POS',
              "AppVersion=$env:VERSION",
              'AppPublisher=PrintPro',
              'AppPublisherURL=https://printpro.my.id',
              'AppSupportURL=https://printpro.my.id',
              'AppUpdatesURL=https://printpro.my.id',
              'DefaultDirName={autopf}\PrintProPOS',
              'DefaultGroupName=PrintPro POS',
              'DisableProgramGroupPage=yes',
              'OutputDir=release_installer',
              "OutputBaseFilename=PrintPro-Setup-v$env:VERSION",
              'Compression=lzma',
              'SolidCompression=yes',
              'WizardStyle=modern',
              'ArchitecturesAllowed=x64compatible',
              'ArchitecturesInstallIn64BitMode=x64compatible',
              '',
              '[Files]',
              'Source: "release_installer\PrintProPOS-win_x64.exe"; DestDir: "{app}"; Flags: ignoreversion',
              'Source: "release_installer\resources.neu"; DestDir: "{app}"; Flags: ignoreversion',
              '',
              '[Icons]',
              'Name: "{group}\PrintPro POS"; Filename: "{app}\PrintProPOS-win_x64.exe"',
              'Name: "{autodesktop}\PrintPro POS"; Filename: "{app}\PrintProPOS-win_x64.exe"',
              '',
              '[Run]',
              'Filename: "{app}\PrintProPOS-win_x64.exe"; Description: "Jalankan PrintPro POS"; Flags: nowait postinstall skipifsilent'
          )

          $lines |
              Set-Content `
              -Path "setup.iss" `
              -Encoding UTF8

          Write-Host ""
          Get-Content "setup.iss"


      # ==========================================================
      # 18. COMPILE INSTALLER
      # ==========================================================
      - name: Compile Installer
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "COMPILE INSTALLER"
          Write-Host "=============================================="

          $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $isccPath)) {
              $isccPath = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $isccPath)) {
              throw "ISCC.exe tidak ditemukan."
          }

          Write-Host "ISCC:"
          Write-Host $isccPath

          & $isccPath "setup.iss"

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup gagal."
          }

          $installer = "release_installer\PrintPro-Setup-v$env:VERSION.exe"

          if (-not (Test-Path $installer)) {
              throw "Installer tidak ditemukan setelah Inno Setup."
          }

          Write-Host ""
          Write-Host "INSTALLER BERHASIL:"
          Get-Item $installer |
              Select-Object FullName, Length


      # ==========================================================
      # 19. VERIFY INSTALLER
      # ==========================================================
      - name: Verify Final Build
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "VERIFY FINAL BUILD"
          Write-Host "=============================================="

          $installer = "release_installer\PrintPro-Setup-v$env:VERSION.exe"
          $resources = "release_installer\resources.neu"

          Write-Host ""
          Write-Host "Checking installer..."

          if (-not (Test-Path $installer)) {
              throw "INSTALLER TIDAK ADA: $installer"
          }

          Write-Host "[OK] Installer"
          Write-Host $installer

          Write-Host ""
          Write-Host "Checking resources..."

          if (-not (Test-Path $resources)) {
              throw "RESOURCES TIDAK ADA: $resources"
          }

          Write-Host "[OK] resources.neu"
          Write-Host $resources

          Write-Host ""
          Write-Host "File size:"

          Get-Item $installer |
              Select-Object Name, Length

          Get-Item $resources |
              Select-Object Name, Length


      # ==========================================================
      # 20. GENERATE UPDATE.JSON
      # ==========================================================
      - name: Generate update.json
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "GENERATE UPDATE.JSON"
          Write-Host "=============================================="

          $repo = $env:GITHUB_REPOSITORY
          $ver = $env:VERSION

          $updateJson = @{
              applicationId = "id.printpro.pos"
              version = $ver
              resourcesURL = "https://github.com/$repo/releases/download/v$ver/resources.neu"
              downloadUrl = "https://github.com/$repo/releases/download/v$ver/PrintPro-Setup-v$ver.exe"
              changelog = "Pembaruan otomatis PrintPro POS versi $ver"
          } |
              ConvertTo-Json -Depth 10

          Set-Content `
              -Path "release_installer\update.json" `
              -Value $updateJson `
              -Encoding UTF8

          if (-not (Test-Path "release_installer\update.json")) {
              throw "update.json gagal dibuat."
          }

          Write-Host ""
          Write-Host "update.json:"
          Get-Content "release_installer\update.json"


      # ==========================================================
      # 21. FINAL RELEASE CHECK
      # ==========================================================
      - name: Final Release Check
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "FINAL RELEASE CHECK"
          Write-Host "=============================================="

          $files = @(
              "release_installer\PrintPro-Setup-v$env:VERSION.exe",
              "release_installer\resources.neu",
              "release_installer\update.json"
          )

          foreach ($file in $files) {

              if (-not (Test-Path $file)) {
                  Write-Host "[ERROR] $file"
                  exit 1
              }

              $item = Get-Item $file

              if ($item.Length -le 0) {
                  Write-Host "[ERROR] File kosong: $file"
                  exit 1
              }

              Write-Host "[OK] $file ($($item.Length) bytes)"
          }

          Write-Host ""
          Write-Host "SEMUA FILE RELEASE VALID."

          Write-Host ""
          Write-Host "Release directory:"
          Get-ChildItem "release_installer" |
              Select-Object Name, Length


      # ==========================================================
      # 22. CREATE GITHUB RELEASE
      # ==========================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PrintPro POS v${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false

          body: |
            # PrintPro POS v${{ env.VERSION }}

            Windows release untuk PrintPro POS.

            ## Files

            - PrintPro-Setup-v${{ env.VERSION }}.exe
            - resources.neu
            - update.json

          files: |
            release_installer/PrintPro-Setup-v${{ env.VERSION }}.exe
            release_installer/resources.neu
            release_installer/update.json

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}